<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCT — 로그인</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;--border:rgba(255,255,255,0.08);--text:#e8eaf0;--text2:#8892a4;--text3:#4d5566;--green:#00c48c;--red:#ff4d6a;--accent:#3d7eff;--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.wrap{width:100%;max-width:380px}
.logo{text-align:center;margin-bottom:2.5rem}
.logo-mark{font-size:36px;font-weight:700;letter-spacing:-.03em;background:linear-gradient(135deg,#fff 0%,#8892a4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:11px;color:var(--text3);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2rem}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.75rem}
.tab{flex:1;padding:10px;font-size:14px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;font-family:var(--font)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:1rem;display:none}
.msg.err{background:rgba(255,77,106,.1);border:1px solid rgba(255,77,106,.2);color:var(--red);display:block}
.msg.ok{background:rgba(0,196,140,.1);border:1px solid rgba(0,196,140,.2);color:var(--green);display:block}
.fg{margin-bottom:1rem}
.fl{font-size:12px;color:var(--text3);margin-bottom:6px;display:block;letter-spacing:.03em}
.pw-wrap{position:relative}
input[type=email],input[type=password],input[type=text]{width:100%;padding:10px 14px;font-size:14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border-color .15s;font-family:var(--font)}
.pw-wrap input{padding-right:48px}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--text3)}
.eye{position:absolute;right:0;top:0;bottom:0;width:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:none;color:var(--text3)}
.eye:hover{color:var(--text2)}
.eye svg{width:18px;height:18px}
.btn{width:100%;padding:11px;font-size:14px;font-weight:500;border-radius:8px;cursor:pointer;border:none;transition:all .15s;font-family:var(--font);margin-top:4px}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{opacity:.88}
.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-g{background:none;color:var(--text2);font-size:13px;margin-top:8px}
.btn-g:hover{color:var(--text)}
.str-bar{height:3px;border-radius:2px;background:var(--bg3);overflow:hidden;margin-top:8px}
.str-fill{height:100%;border-radius:2px;transition:all .3s;width:0}
.str-label{font-size:11px;margin-top:4px}
.rules{margin-top:8px}
.rule{font-size:12px;color:var(--text3);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.rule.ok{color:var(--green)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);cursor:pointer;background:none;border:none;padding:0;margin-bottom:1.5rem;font-family:var(--font)}
.back:hover{color:var(--text)}
.h2{font-size:18px;font-weight:600;margin-bottom:6px}
.sub{font-size:13px;color:var(--text2);margin-bottom:1.5rem}
.center{text-align:center}
.big{font-size:40px;margin-bottom:1rem}
.terms{font-size:12px;color:var(--text3);text-align:center;margin-top:1rem;line-height:1.7}
.divider{display:flex;align-items:center;gap:10px;margin:1rem 0;color:var(--text3);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.btn-google{width:100%;padding:11px;font-size:14px;font-weight:500;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);transition:all .15s;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-google:hover{background:rgba(255,255,255,.07)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-mark">CCT</div>
    <div class="logo-sub">Crypto Currency Trader</div>
  </div>

  <!-- 로그인/회원가입 -->
  <div class="card" id="c-auth">
    <div class="tabs">
      <button class="tab on" id="t-login" onclick="switchTab('login')">로그인</button>
      <button class="tab" id="t-signup" onclick="switchTab('signup')">회원가입</button>
    </div>
    <div class="msg" id="auth-msg"></div>

    <!-- 구글 로그인 -->
    <button class="btn-google" onclick="doGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Google로 계속하기
    </button>
    <div class="divider">또는</div>

    <!-- 로그인 -->
    <div id="f-login">
      <div class="fg"><label class="fl">이메일</label><input type="email" id="l-email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="fg"><label class="fl">비밀번호</label>
        <div class="pw-wrap">
          <input type="password" id="l-pw" placeholder="비밀번호" autocomplete="current-password">
          <button class="eye" onclick="togglePw('l-pw',this)" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button class="btn btn-p" id="btn-login" onclick="doLogin()">로그인</button>
      <button class="btn btn-g" onclick="showForgot()">비밀번호를 잊으셨나요?</button>
    </div>

    <!-- 회원가입 -->
    <div id="f-signup" style="display:none">
      <div class="fg"><label class="fl">이메일</label><input type="email" id="s-email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="fg"><label class="fl">비밀번호</label>
        <div class="pw-wrap">
          <input type="password" id="s-pw" placeholder="8자 이상" autocomplete="new-password" oninput="checkStr(this.value)">
          <button class="eye" onclick="togglePw('s-pw',this)" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="str-bar"><div class="str-fill" id="str-fill"></div></div>
        <div class="str-label" id="str-lbl"></div>
        <div class="rules" id="rules">
          <div class="rule" id="r-len">○ 8자 이상</div>
          <div class="rule" id="r-num">○ 숫자 포함</div>
          <div class="rule" id="r-sp">○ 특수문자 포함 (!@#$ 등)</div>
        </div>
      </div>
      <div class="fg"><label class="fl">비밀번호 확인</label>
        <div class="pw-wrap">
          <input type="password" id="s-pw2" placeholder="비밀번호 재입력" autocomplete="new-password" oninput="checkPw2()">
          <button class="eye" onclick="togglePw('s-pw2',this)" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button class="btn btn-p" id="btn-signup" onclick="doSignup()">계정 만들기</button>
      <div class="terms">가입하면 이용약관 및 개인정보처리방침에 동의합니다</div>
    </div>
  </div>

  <!-- 비밀번호 찾기 -->
  <div class="card" id="c-forgot" style="display:none">
    <button class="back" onclick="showAuth()">← 돌아가기</button>
    <div class="h2">비밀번호 재설정</div>
    <div class="sub">이메일로 재설정 링크를 보내드려요</div>
    <div class="msg" id="forgot-msg"></div>
    <div class="fg"><label class="fl">이메일</label><input type="email" id="f-email" placeholder="you@example.com"></div>
    <button class="btn btn-p" id="btn-forgot" onclick="doForgot()">재설정 링크 보내기</button>
  </div>

  <!-- 인증 메일 발송 완료 -->
  <div class="card center" id="c-verify" style="display:none">
    <div class="big">📬</div>
    <div class="h2" style="margin-bottom:8px">이메일을 확인해주세요</div>
    <div class="sub" id="verify-txt"></div>
    <div style="font-size:13px;color:var(--text3);margin-bottom:1.25rem">스팸함도 확인해보세요</div>
    <button class="btn btn-p" onclick="resend()">인증 메일 다시 보내기</button>
    <button class="btn btn-g" onclick="showAuth()">로그인으로 돌아가기</button>
  </div>
  <!-- 비밀번호 재설정 폼 -->
  <div class="card" id="c-reset" style="display:none">
    <div class="h2" style="margin-bottom:6px">새 비밀번호 설정</div>
    <div class="sub">새로 사용할 비밀번호를 입력해주세요</div>
    <div class="msg" id="reset-msg"></div>
    <div class="fg" style="margin-bottom:1rem">
      <label class="fl">새 비밀번호</label>
      <div class="pw-wrap">
        <input type="password" id="r-pw" placeholder="8자 이상" oninput="checkStr(this.value)">
        <button class="eye" onclick="togglePw('r-pw',this)" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="str-bar"><div class="str-fill" id="r-str-fill"></div></div>
      <div class="str-label" id="r-str-lbl"></div>
    </div>
    <div class="fg" style="margin-bottom:0">
      <label class="fl">비밀번호 확인</label>
      <div class="pw-wrap">
        <input type="password" id="r-pw2" placeholder="비밀번호 재입력" oninput="checkPw2()">
        <button class="eye" onclick="togglePw('r-pw2',this)" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <button class="btn btn-p" id="btn-reset" onclick="doReset()" style="margin-top:1rem">비밀번호 변경</button>
  </div>

  <!-- 이메일 인증 완료 -->
  <div class="card center" id="c-verify-done" style="display:none">
    <div class="big">✅</div>
    <div class="h2" style="margin-bottom:8px">인증 완료!</div>
    <div class="sub">잠시 후 자동으로 이동합니다...</div>
  </div>

</div>

<script src="./supabase.js"></script>
<script>
const db = window._supabase;
let tab = 'login', lastEmail = '';

// URL 토큰 처리 (비번 재설정 / 이메일 인증)
const hash = window.location.hash;
const params = new URLSearchParams(hash.replace('#',''));
const tokenType = params.get('type');
const accessToken = params.get('access_token');
const refreshToken = params.get('refresh_token');

if (tokenType === 'recovery' && accessToken) {
  // 비밀번호 재설정 링크 클릭 → 재설정 폼 보여주기
  db.auth.setSession({ access_token: accessToken, refresh_token: refreshToken || '' })
    .then(() => showResetPw());
} else if (tokenType === 'signup' && accessToken) {
  // 이메일 인증 완료 → 자동 로그인 후 앱으로
  db.auth.setSession({ access_token: accessToken, refresh_token: refreshToken || '' })
    .then(() => { showVerifyDone(); setTimeout(() => location.href='./index.html', 2000); });
} else {
  db.auth.getSession().then(({data:{session}}) => { if(session) location.href='./index.html'; });
}

function switchTab(t) {
  tab = t;
  document.getElementById('f-login').style.display = t==='login'?'block':'none';
  document.getElementById('f-signup').style.display = t==='signup'?'block':'none';
  document.getElementById('t-login').className = 'tab'+(t==='login'?' on':'');
  document.getElementById('t-signup').className = 'tab'+(t==='signup'?' on':'');
  setMsg('');
}

function setMsg(txt, type='err', id='auth-msg') {
  const el = document.getElementById(id);
  el.textContent = txt; el.className = 'msg'+(txt?' '+(type):'');
}

function setLoading(id, on, txt) {
  const b = document.getElementById(id);
  b.disabled = on;
  b.innerHTML = on ? '<span class="spin"></span>잠시만요...' : txt;
}

function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const isHidden = inp.type === 'password';
  inp.type = isHidden ? 'text' : 'password';
  // 아이콘 교체 (숨김 아이콘)
  btn.innerHTML = isHidden
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}

function checkStr(pw) {
  const isReset = document.getElementById('c-reset').style.display !== 'none';
  const fillId = isReset ? 'r-str-fill' : 'str-fill';
  const lblId  = isReset ? 'r-str-lbl'  : 'str-lbl';
  const hasLen=pw.length>=8, hasNum=/\d/.test(pw), hasSp=/[!@#$%^&*(),.?":{}|<>]/.test(pw);
  const score=[hasLen,hasNum,hasSp].filter(Boolean).length;
  const cfgs=[{w:'33%',c:'#ff4d6a',t:'약함'},{w:'66%',c:'#f59e0b',t:'보통'},{w:'100%',c:'#00c48c',t:'강함'}];
  const cfg = pw ? (cfgs[score-1]||cfgs[0]) : {w:'0',c:'',t:''};
  document.getElementById(fillId).style.cssText=`width:${cfg.w};background:${cfg.c}`;
  document.getElementById(lblId).textContent=cfg.t;
  document.getElementById(lblId).style.color=cfg.c;
  if (!isReset) {
    [['r-len',hasLen],['r-num',hasNum],['r-sp',hasSp]].forEach(([id,ok])=>{
      const el=document.getElementById(id);
      el.className='rule'+(ok?' ok':'');
      el.textContent=(ok?'✓':'○')+el.textContent.slice(1);
    });
  }
}

async function doGoogle() {
  const { error } = await db.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + '/index.html' }
  });
  if (error) setMsg('Google 로그인에 실패했어요.');
}

async function doLogin() {
  const email=document.getElementById('l-email').value.trim();
  const pw=document.getElementById('l-pw').value;
  if(!email||!pw){setMsg('이메일과 비밀번호를 입력해주세요.');return;}
  setMsg(''); setLoading('btn-login',true,'로그인');
  const {error}=await db.auth.signInWithPassword({email,password:pw});
  setLoading('btn-login',false,'로그인');
  if(error){
    const m=error.message.includes('Invalid')?'이메일 또는 비밀번호가 틀렸어요.':
             error.message.includes('confirmed')?'이메일 인증을 먼저 완료해주세요.':
             '로그인에 실패했어요.';
    setMsg(m);
  } else { location.href='./index.html'; }
}

async function doSignup() {
  const email=document.getElementById('s-email').value.trim();
  const pw=document.getElementById('s-pw').value;
  const pw2=document.getElementById('s-pw2').value;
  if(!email||!pw||!pw2){setMsg('모든 항목을 입력해주세요.');return;}
  if(pw!==pw2){setMsg('비밀번호가 일치하지 않아요.');return;}
  if(pw.length<8){setMsg('비밀번호는 8자 이상이어야 해요.');return;}
  setMsg(''); setLoading('btn-signup',true,'계정 만들기');
  const {error}=await db.auth.signUp({email,password:pw});
  setLoading('btn-signup',false,'계정 만들기');
  if(error){
    const m=error.message.includes('already')?'이미 가입된 이메일이에요.':'가입에 실패했어요.';
    setMsg(m);
  } else { lastEmail=email; showVerify(email); }
}

function showForgot(){
  document.getElementById('c-auth').style.display='none';
  document.getElementById('c-forgot').style.display='block';
  document.getElementById('c-verify').style.display='none';
}
function showAuth(){
  document.getElementById('c-auth').style.display='block';
  document.getElementById('c-forgot').style.display='none';
  document.getElementById('c-verify').style.display='none';
  setMsg('','err','forgot-msg');
}
function showVerify(email){
  document.getElementById('c-auth').style.display='none';
  document.getElementById('c-forgot').style.display='none';
  document.getElementById('c-verify').style.display='block';
  document.getElementById('verify-txt').textContent=email+' 으로 인증 메일을 보냈어요.';
}

async function doForgot(){
  const email=document.getElementById('f-email').value.trim();
  if(!email){setMsg('이메일을 입력해주세요.','err','forgot-msg');return;}
  setMsg('','err','forgot-msg'); setLoading('btn-forgot',true,'재설정 링크 보내기');
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/auth.html'});
  setLoading('btn-forgot',false,'재설정 링크 보내기');
  setMsg(error?'메일 발송에 실패했어요.':'재설정 링크를 보냈어요. 이메일을 확인해주세요.',error?'err':'ok','forgot-msg');
}

function checkPw2(){
  const pw=document.getElementById("s-pw").value;
  const pw2=document.getElementById("s-pw2").value;
  const el=document.getElementById("s-pw2");
  if(!pw2) { el.style.borderColor=""; return; }
  el.style.borderColor = pw===pw2 ? "var(--green)" : "var(--red)";
}
async function resend(){
  if(!lastEmail)return;
  await db.auth.resend({type:'signup',email:lastEmail});
  setMsg('인증 메일을 다시 보냈어요.','ok','auth-msg');
}

function showResetPw() {
  ['c-auth','c-forgot','c-verify','c-verify-done'].forEach(id => {
    document.getElementById(id).style.display='none';
  });
  document.getElementById('c-reset').style.display='block';
}

function showVerifyDone() {
  ['c-auth','c-forgot','c-verify','c-reset'].forEach(id => {
    document.getElementById(id).style.display='none';
  });
  document.getElementById('c-verify-done').style.display='block';
}

async function doReset() {
  const pw = document.getElementById('r-pw').value;
  const pw2 = document.getElementById('r-pw2').value;
  if (!pw || !pw2) { setMsg('비밀번호를 입력해주세요.','err','reset-msg'); return; }
  if (pw !== pw2) { setMsg('비밀번호가 일치하지 않아요.','err','reset-msg'); return; }
  if (pw.length < 8) { setMsg('비밀번호는 8자 이상이어야 해요.','err','reset-msg'); return; }
  setLoading('btn-reset', true, '비밀번호 변경');
  const { error } = await db.auth.updateUser({ password: pw });
  setLoading('btn-reset', false, '비밀번호 변경');
  if (error) {
    setMsg('변경에 실패했어요. 다시 시도해주세요.','err','reset-msg');
  } else {
    setMsg('비밀번호가 변경됐어요! 잠시 후 이동합니다.','ok','reset-msg');
    setTimeout(() => location.href='./index.html', 2000);
  }
}

function checkPw2() {
  const pw = document.getElementById('s-pw') ? document.getElementById('s-pw').value : document.getElementById('r-pw').value;
  const pw2El = document.getElementById('s-pw2') || document.getElementById('r-pw2');
  if (!pw2El.value) { pw2El.style.borderColor=''; return; }
  pw2El.style.borderColor = pw === pw2El.value ? 'var(--green)' : 'var(--red)';
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(document.getElementById('c-forgot').style.display!=='none') doForgot();
  else if(tab==='login') doLogin();
  else doSignup();
});
</script>
