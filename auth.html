<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCT — 로그인</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0f1117;
  --bg2: #161b27;
  --bg3: #1e2535;
  --border: rgba(255,255,255,0.07);
  --text: #e8eaf0;
  --text2: #8892a4;
  --text3: #4d5566;
  --green: #00c48c;
  --red: #ff4d6a;
  --accent: #3d7eff;
  --radius: 12px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
}

.container { width: 100%; max-width: 400px; }

/* 로고 */
.logo-wrap { text-align: center; margin-bottom: 2.5rem; }
.logo-mark {
  font-size: 32px; font-weight: 700; letter-spacing: -.03em;
  background: linear-gradient(135deg, #fff 0%, #8892a4 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-sub { font-size: 11px; color: var(--text3); letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; }

/* 카드 */
.card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 2rem;
}
.card-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.card-sub { font-size: 13px; color: var(--text2); margin-bottom: 1.75rem; }

/* 탭 */
.tabs { display: flex; gap: 0; margin-bottom: 1.75rem; border-bottom: 1px solid var(--border); }
.tab-btn {
  flex: 1; padding: 10px; font-size: 14px; cursor: pointer;
  border: none; background: none; color: var(--text2);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: all .15s;
}
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

/* 폼 */
.form-group { margin-bottom: 1rem; }
.form-label { font-size: 12px; color: var(--text3); letter-spacing: .04em; margin-bottom: 6px; display: block; }
input[type=email], input[type=password], input[type=text] {
  width: 100%; padding: 10px 14px; font-size: 14px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); outline: none;
  transition: border-color .15s;
}
input:focus { border-color: var(--accent); }
input::placeholder { color: var(--text3); }

/* 비밀번호 토글 */
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 40px; }
.pw-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  cursor: pointer; color: var(--text3); font-size: 13px;
  background: none; border: none; padding: 0;
}
.pw-toggle:hover { color: var(--text2); }

/* 버튼 */
.btn {
  width: 100%; padding: 11px; font-size: 14px; font-weight: 500;
  border-radius: 8px; cursor: pointer; border: none;
  transition: all .15s; margin-top: 4px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: .88; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost { background: none; color: var(--text2); font-size: 13px; margin-top: 8px; }
.btn-ghost:hover { color: var(--text); }

/* 구분선 */
.divider { display: flex; align-items: center; gap: 10px; margin: 1.25rem 0; }
.divider-line { flex: 1; height: 1px; background: var(--border); }
.divider-text { font-size: 12px; color: var(--text3); }

/* 메시지 */
.msg {
  padding: 10px 14px; border-radius: 8px; font-size: 13px;
  margin-bottom: 1rem; display: none;
}
.msg.error { background: rgba(255,77,106,.1); border: 1px solid rgba(255,77,106,.2); color: var(--red); }
.msg.success { background: rgba(0,196,140,.1); border: 1px solid rgba(0,196,140,.2); color: var(--green); }
.msg.show { display: block; }

/* 로딩 스피너 */
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .7s linear infinite; margin-right: 6px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 비밀번호 강도 */
.pw-strength { margin-top: 6px; display: none; }
.pw-strength.show { display: block; }
.pw-strength-bar { height: 3px; border-radius: 2px; background: var(--bg3); overflow: hidden; margin-bottom: 4px; }
.pw-strength-fill { height: 100%; border-radius: 2px; transition: all .3s; width: 0; }
.pw-strength-label { font-size: 11px; color: var(--text3); }

/* 조건 체크리스트 */
.pw-rules { margin-top: 8px; display: none; }
.pw-rules.show { display: block; }
.pw-rule { font-size: 12px; color: var(--text3); margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
.pw-rule.ok { color: var(--green); }
.pw-rule-icon { width: 14px; text-align: center; }

/* 약관 */
.terms { font-size: 12px; color: var(--text3); text-align: center; margin-top: 1rem; line-height: 1.6; }
.terms a { color: var(--text2); text-decoration: underline; }

/* 비밀번호 찾기 뷰 */
.back-btn {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text2); cursor: pointer;
  background: none; border: none; padding: 0; margin-bottom: 1.5rem;
}
.back-btn:hover { color: var(--text); }

@media (max-width: 440px) {
  .card { padding: 1.5rem; }
}
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <div class="logo-mark">CCT</div>
    <div class="logo-sub">Crypto Currency Trader</div>
  </div>

  <!-- 로그인 / 회원가입 카드 -->
  <div class="card" id="auth-card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">로그인</button>
      <button class="tab-btn" onclick="switchTab('signup')">회원가입</button>
    </div>

    <div id="msg" class="msg"></div>

    <!-- 로그인 폼 -->
    <div id="form-login">
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <div class="pw-wrap">
          <input type="password" id="login-pw" placeholder="비밀번호 입력" autocomplete="current-password">
          <button class="pw-toggle" onclick="togglePw('login-pw', this)" type="button">보기</button>
        </div>
      </div>
      <button class="btn btn-primary" id="login-btn" onclick="doLogin()">로그인</button>
      <button class="btn btn-ghost" onclick="showForgot()">비밀번호를 잊으셨나요?</button>
    </div>

    <!-- 회원가입 폼 -->
    <div id="form-signup" style="display:none">
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <div class="pw-wrap">
          <input type="password" id="signup-pw" placeholder="8자 이상" autocomplete="new-password"
            oninput="checkPwStrength(this.value)">
          <button class="pw-toggle" onclick="togglePw('signup-pw', this)" type="button">보기</button>
        </div>
        <div class="pw-strength" id="pw-strength">
          <div class="pw-strength-bar"><div class="pw-strength-fill" id="pw-fill"></div></div>
          <div class="pw-strength-label" id="pw-label"></div>
        </div>
        <div class="pw-rules" id="pw-rules">
          <div class="pw-rule" id="rule-len"><span class="pw-rule-icon">○</span> 8자 이상</div>
          <div class="pw-rule" id="rule-num"><span class="pw-rule-icon">○</span> 숫자 포함</div>
          <div class="pw-rule" id="rule-special"><span class="pw-rule-icon">○</span> 특수문자 포함 (!@#$ 등)</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호 확인</label>
        <div class="pw-wrap">
          <input type="password" id="signup-pw2" placeholder="비밀번호 재입력" autocomplete="new-password">
          <button class="pw-toggle" onclick="togglePw('signup-pw2', this)" type="button">보기</button>
        </div>
      </div>
      <button class="btn btn-primary" id="signup-btn" onclick="doSignup()">계정 만들기</button>
      <div class="terms">가입하면 <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의하는 것으로 간주합니다.</div>
    </div>
  </div>

  <!-- 비밀번호 찾기 카드 -->
  <div class="card" id="forgot-card" style="display:none">
    <button class="back-btn" onclick="showAuth()">← 로그인으로 돌아가기</button>
    <div class="card-title">비밀번호 재설정</div>
    <div class="card-sub">가입한 이메일을 입력하면 재설정 링크를 보내드려요.</div>
    <div id="forgot-msg" class="msg"></div>
    <div class="form-group">
      <label class="form-label">이메일</label>
      <input type="email" id="forgot-email" placeholder="you@example.com">
    </div>
    <button class="btn btn-primary" id="forgot-btn" onclick="doForgot()">재설정 링크 보내기</button>
  </div>

  <!-- 이메일 확인 안내 카드 -->
  <div class="card" id="verify-card" style="display:none;text-align:center">
    <div style="font-size:36px;margin-bottom:1rem">📬</div>
    <div class="card-title" style="margin-bottom:8px">이메일을 확인해주세요</div>
    <div class="card-sub" style="margin-bottom:1.5rem" id="verify-email-text"></div>
    <div style="font-size:13px;color:var(--text3);margin-bottom:1.25rem">
      이메일이 오지 않으면 스팸함을 확인해보세요.
    </div>
    <button class="btn btn-primary" onclick="resendVerify()">인증 메일 다시 보내기</button>
    <button class="btn btn-ghost" onclick="showAuth()">로그인으로 돌아가기</button>
  </div>
</div>

<script src="./supabase.js"></script>
<script>
const db = window._supabase;

// 이미 로그인 상태면 앱으로
db.auth.getSession().then(({ data: { session } }) => {
  if (session) location.href = './index.html';
});

let currentTab = 'login';
let lastSignupEmail = '';

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
  });
  clearMsg();
}

function showMsg(text, type = 'error', targetId = 'msg') {
  const el = document.getElementById(targetId);
  el.textContent = text;
  el.className = `msg ${type} show`;
}
function clearMsg(targetId = 'msg') {
  const el = document.getElementById(targetId);
  el.className = 'msg';
}

function setLoading(btnId, loading, defaultText) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading ? `<span class="spinner"></span>잠시만요...` : defaultText;
}

function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  const isText = input.type === 'text';
  input.type = isText ? 'password' : 'text';
  btn.textContent = isText ? '보기' : '숨기기';
}

// 비밀번호 강도 체크
function checkPwStrength(pw) {
  const strengthEl = document.getElementById('pw-strength');
  const rulesEl = document.getElementById('pw-rules');
  const fill = document.getElementById('pw-fill');
  const label = document.getElementById('pw-label');

  if (!pw) {
    strengthEl.classList.remove('show');
    rulesEl.classList.remove('show');
    return;
  }
  strengthEl.classList.add('show');
  rulesEl.classList.add('show');

  const hasLen = pw.length >= 8;
  const hasNum = /\d/.test(pw);
  const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(pw);

  setRule('rule-len', hasLen);
  setRule('rule-num', hasNum);
  setRule('rule-special', hasSpecial);

  const score = [hasLen, hasNum, hasSpecial].filter(Boolean).length;
  const configs = [
    { w: '33%', color: '#ff4d6a', text: '약함' },
    { w: '66%', color: '#f59e0b', text: '보통' },
    { w: '100%', color: '#00c48c', text: '강함' },
  ];
  const c = configs[score - 1] || { w: '10%', color: '#ff4d6a', text: '' };
  fill.style.width = c.w;
  fill.style.background = c.color;
  label.textContent = c.text;
  label.style.color = c.color;
}

function setRule(id, ok) {
  const el = document.getElementById(id);
  el.classList.toggle('ok', ok);
  el.querySelector('.pw-rule-icon').textContent = ok ? '✓' : '○';
}

// 로그인
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  if (!email || !pw) { showMsg('이메일과 비밀번호를 입력해주세요.'); return; }
  clearMsg();
  setLoading('login-btn', true, '로그인');
  const { error } = await db.auth.signInWithPassword({ email, password: pw });
  setLoading('login-btn', false, '로그인');
  if (error) {
    const msg = error.message.includes('Invalid login') ? '이메일 또는 비밀번호가 올바르지 않아요.' :
                error.message.includes('Email not confirmed') ? '이메일 인증을 먼저 완료해주세요.' :
                '로그인에 실패했어요. 다시 시도해주세요.';
    showMsg(msg);
  } else {
    location.href = './index.html';
  }
}

// 회원가입
async function doSignup() {
  const email = document.getElementById('signup-email').value.trim();
  const pw = document.getElementById('signup-pw').value;
  const pw2 = document.getElementById('signup-pw2').value;
  if (!email || !pw || !pw2) { showMsg('모든 항목을 입력해주세요.'); return; }
  if (pw !== pw2) { showMsg('비밀번호가 일치하지 않아요.'); return; }
  if (pw.length < 8) { showMsg('비밀번호는 8자 이상이어야 해요.'); return; }
  clearMsg();
  setLoading('signup-btn', true, '계정 만들기');
  const { error } = await db.auth.signUp({ email, password: pw });
  setLoading('signup-btn', false, '계정 만들기');
  if (error) {
    const msg = error.message.includes('already registered') ? '이미 가입된 이메일이에요. 로그인을 시도해보세요.' :
                '가입에 실패했어요. 다시 시도해주세요.';
    showMsg(msg);
  } else {
    lastSignupEmail = email;
    showVerify(email);
  }
}

// 비밀번호 찾기
function showForgot() {
  document.getElementById('auth-card').style.display = 'none';
  document.getElementById('forgot-card').style.display = 'block';
  document.getElementById('verify-card').style.display = 'none';
}
function showAuth() {
  document.getElementById('auth-card').style.display = 'block';
  document.getElementById('forgot-card').style.display = 'none';
  document.getElementById('verify-card').style.display = 'none';
  clearMsg('forgot-msg');
}
function showVerify(email) {
  document.getElementById('auth-card').style.display = 'none';
  document.getElementById('forgot-card').style.display = 'none';
  document.getElementById('verify-card').style.display = 'block';
  document.getElementById('verify-email-text').textContent = `${email} 으로 인증 메일을 보냈어요.`;
}

async function doForgot() {
  const email = document.getElementById('forgot-email').value.trim();
  if (!email) { showMsg('이메일을 입력해주세요.', 'error', 'forgot-msg'); return; }
  clearMsg('forgot-msg');
  setLoading('forgot-btn', true, '재설정 링크 보내기');
  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + '/index.html',
  });
  setLoading('forgot-btn', false, '재설정 링크 보내기');
  if (error) {
    showMsg('메일 발송에 실패했어요. 이메일을 확인해주세요.', 'error', 'forgot-msg');
  } else {
    showMsg('재설정 링크를 보냈어요. 이메일을 확인해주세요.', 'success', 'forgot-msg');
  }
}

async function resendVerify() {
  if (!lastSignupEmail) return;
  const { error } = await db.auth.resend({ type: 'signup', email: lastSignupEmail });
  if (!error) showMsg('인증 메일을 다시 보냈어요.', 'success', 'msg');
}

// 엔터키
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('forgot-card').style.display !== 'none') doForgot();
  else if (currentTab === 'login') doLogin();
  else doSignup();
});
</script>
</body>
</html>
